<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD TAKKAL | Parfum</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #071a2b;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 8px;
      color: #d7b56d;
    }

    .hero {
      padding: 70px 20px;
      text-align: center;
      background: linear-gradient(135deg, #071a2b, #123b5c);
      color: white;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 19px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #d7b56d;
      color: #071a2b;
      padding: 14px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .products {
      padding: 45px 20px;
      text-align: center;
    }

    .products h2 {
      margin-bottom: 30px;
      font-size: 30px;
    }

    .product-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .product {
      background: white;
      width: 280px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .bottle {
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eeeeee;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 25px;
      font-weight: bold;
      color: #071a2b;
    }

    .product h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .price {
      color: #b08a35;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    footer {
      background: #071a2b;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MD TAKKAL</h1>
    <p>PARFUM</p>
  </header>

  <section class="hero">
    <h2>عطرك... هويتك</h2>
    <p>اكتشف مجموعة عطور MD TAKKAL</p>
    <a href="#products" class="button">اكتشف العطور</a>
  </section>

  <section class="products" id="products">
    <h2>عطور MD TAKKAL</h2>

    <div class="product-container">

      <div class="product">
        <div class="bottle">
          MD TAKKAL
        </div>

        <h3>MD TAKKAL Homme</h3>
        <p>عطر أنيق وفاخر للرجال</p>
        <div class="price">299 DH</div>

        <a class="button"
           href="https://wa.me/212600000000?text=السلام%20عليكم،%20أريد%20طلب%20عطر%20MD%20TAKKAL">
          اطلب الآن
        </a>
      </div>

      <div class="product">
        <div class="bottle">
          MD TAKKAL
        </div>

        <h3>MD TAKKAL Gold</h3>
        <p>رائحة فاخرة ومميزة</p>
        <div class="price">349 DH</div>

        <a class="button"
           href="https://wa.me/212600000000?text=السلام%20عليكم،%20أريد%20طلب%20عطر%20MD%20TAKKAL%20Gold">
          اطلب الآن
        </a>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 MD TAKKAL PARFUM</p>
    <p>جميع الحقوق محفوظة</p>
  </footer>

</body>
</html>
